<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reels Generator</title>
    <style>
      :root {
        --bg: #0f1016;
        --card: #191b24;
        --line: #2a2d3a;
        --ink: #eceef5;
        --mut: #9aa0b4;
        --accent: #ffd23f;
        --ok: #4ade80;
        --err: #f87171;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, system-ui, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--ink);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 32px 16px 64px;
      }
      .wrap { width: 100%; max-width: 820px; }
      h1 { font-size: 26px; margin: 0 0 4px; }
      .sub { color: var(--mut); margin: 0 0 28px; font-size: 15px; }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 22px;
        margin-bottom: 18px;
      }
      label { display: block; font-size: 13px; color: var(--mut); margin-bottom: 7px; }
      textarea, select {
        width: 100%;
        background: #0e0f16;
        border: 1px solid var(--line);
        color: var(--ink);
        border-radius: 10px;
        padding: 12px 13px;
        font-size: 15px;
        font-family: inherit;
        resize: vertical;
      }
      textarea { min-height: 86px; }
      .row { display: flex; gap: 14px; margin-top: 16px; align-items: flex-end; }
      .row > div:first-child { flex: 1; }
      button {
        background: var(--accent);
        color: #1b1a22;
        border: 0;
        border-radius: 10px;
        padding: 13px 22px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        white-space: nowrap;
      }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
      .chip {
        background: #0e0f16;
        border: 1px solid var(--line);
        color: var(--mut);
        border-radius: 999px;
        padding: 6px 13px;
        font-size: 13px;
        cursor: pointer;
      }
      .chip:hover { border-color: var(--accent); color: var(--ink); }
      .steps { list-style: none; padding: 0; margin: 0; }
      .steps li {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 9px 0;
        color: var(--mut);
        font-size: 15px;
        border-bottom: 1px solid var(--line);
      }
      .steps li:last-child { border-bottom: 0; }
      .dot {
        width: 20px; height: 20px; border-radius: 50%;
        border: 2px solid var(--line); flex: none;
        display: grid; place-items: center; font-size: 12px;
      }
      li.active { color: var(--ink); }
      li.active .dot { border-color: var(--accent); animation: pulse 1.1s infinite; }
      li.done { color: var(--ink); }
      li.done .dot { border-color: var(--ok); background: var(--ok); color: #0f1016; }
      @keyframes pulse { 50% { box-shadow: 0 0 0 5px rgba(255,210,63,0.15); } }
      pre {
        background: #0a0b11;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px;
        font-size: 12px;
        color: var(--mut);
        max-height: 150px;
        overflow: auto;
        white-space: pre-wrap;
        margin: 14px 0 0;
      }
      video { width: 100%; max-width: 340px; border-radius: 14px; display: block; }
      .hide { display: none; }
      .err { color: var(--err); font-size: 14px; margin-top: 12px; }
      a.dl { color: var(--accent); font-size: 14px; display: inline-block; margin-top: 12px; }
      .note { color: var(--mut); font-size: 12px; margin-top: 10px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>🎬 Reels Generator</h1>
      <p class="sub">Tulis satu tokoh/topik, dapat video stickman vertikal (1080×1920).</p>

      <div class="card" id="form">
        <label for="prompt">Tokoh atau topik</label>
        <textarea id="prompt" placeholder="Contoh: Alan Turing, bapak ilmu komputer"></textarea>
        <div class="chips" id="chips"></div>
        <div class="row">
          <div>
            <label for="voice">Suara</label>
            <select id="voice">
              <option value="nPczCjzI2devNBz1zQrb">Brian (default)</option>
              <option value="pNInz6obpgDQGcFmaJgB">Adam</option>
              <option value="EXAVITQu4vr4xnSDxMaL">Sarah</option>
            </select>
          </div>
          <button id="go">Buat video</button>
        </div>
        <p class="note">Perlu <code>ELEVENLABS_API_KEY</code> & <code>ANTHROPIC_API_KEY</code> di <code>.env</code>. Proses ±2–5 menit.</p>
      </div>

      <div class="card hide" id="progress">
        <ul class="steps" id="steps"></ul>
        <pre id="log"></pre>
        <p class="err hide" id="error"></p>
      </div>

      <div class="card hide" id="result">
        <label id="resultLabel">Selesai 🎉</label>
        <video id="video" controls playsinline></video>
        <a class="dl" id="dl" href="/api/video" download>⬇ Unduh MP4</a>
        <div><button id="again" style="margin-top:16px;background:#2a2d3a;color:var(--ink)">Buat lagi</button></div>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const samples = ['Alan Turing', 'Ada Lovelace', 'Thomas Edison', 'Katherine Johnson', 'Galileo Galilei'];
      $('chips').innerHTML = samples.map((s) => `<span class="chip">${s}</span>`).join('');
      $('chips').onclick = (e) => { if (e.target.classList.contains('chip')) $('prompt').value = e.target.textContent; };

      let poll = null;
      function show(el, on) { $(el).classList.toggle('hide', !on); }

      async function start() {
        const prompt = $('prompt').value.trim();
        if (!prompt) return $('prompt').focus();
        $('go').disabled = true;
        show('result', false);
        show('progress', true);
        $('error').classList.add('hide');
        const r = await fetch('/api/generate', {
          method: 'POST',
          headers: {'content-type': 'application/json'},
          body: JSON.stringify({prompt, voiceId: $('voice').value}),
        });
        const data = await r.json();
        if (!r.ok) { fail(data.error); return; }
        renderSteps(data.steps, -1);
        poll = setInterval(tick, 1800);
      }

      function renderSteps(steps, activeIndex, doneAll) {
        $('steps').innerHTML = steps
          .map((s, i) => {
            const done = doneAll || i < activeIndex;
            const active = !doneAll && i === activeIndex;
            const cls = done ? 'done' : active ? 'active' : '';
            const mark = done ? '✓' : i + 1;
            return `<li class="${cls}"><span class="dot">${mark}</span>${s.label}</li>`;
          })
          .join('');
      }

      async function tick() {
        const r = await fetch('/api/status');
        const s = await r.json();
        if (s.log) $('log').textContent = s.log;
        if (s.state === 'running') {
          renderSteps(s.steps, s.stepIndex);
        } else if (s.state === 'done') {
          clearInterval(poll);
          renderSteps(s.steps, s.steps.length, true);
          show('result', true);
          $('resultLabel').textContent = s.prompt ? `Selesai: ${s.prompt} 🎉` : 'Selesai 🎉';
          const v = $('video');
          v.src = '/api/video?t=' + Date.now();
          $('go').disabled = false;
        } else if (s.state === 'error') {
          clearInterval(poll);
          fail(s.error || 'Terjadi error.');
        }
      }

      function fail(msg) {
        if (poll) clearInterval(poll);
        $('error').textContent = '⚠ ' + msg;
        $('error').classList.remove('hide');
        $('go').disabled = false;
      }

      $('go').onclick = start;
      $('again').onclick = () => { show('result', false); show('progress', false); $('prompt').focus(); };
      $('prompt').addEventListener('keydown', (e) => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') start(); });
    </script>
  </body>
</html>
